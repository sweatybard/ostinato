<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="theme-color" content="#1a1a1a">
<title>Ostinato — Music, kept.</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f5c518'/%3E%3Cpath d='M12 8v11.5a3.5 3.5 0 1 1-2-3.15V10l8-1.5v8a3.5 3.5 0 1 1-2-3.15V8.5L12 8z' fill='%231a1a1a'/%3E%3C/svg%3E">
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22Ostinato%22%2C%22short_name%22%3A%22Ostinato%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%231a1a1a%22%2C%22theme_color%22%3A%22%231a1a1a%22%7D">
<style>
html[data-theme="dark"]{
 --bg:#1a1a1a;--bg2:#242424;--bg3:#2e2e2e;--card:#2a2a2a;--card-hover:#333;
 --border:#3a3a3a;--text:#e8e8e8;--muted:#9a9a9a;--accent:#f5c518;
 --keeper:#f5c518;--keeper-bg:rgba(245,197,24,.08);
 --red:#e85a5a;--green:#5abf6e;--blue:#5a9ae8;--purple:#b87bd9;
 --map-land:#3a3a3a;--map-land-active:#f5c518;--map-border:#555;--map-ocean:#1e1e1e;
 --g-electronic:#5a9ae8;--g-folk:#78b968;--g-jazz:#b87bd9;--g-metal:#e07070;
 --g-pop:#e8c470;--g-rock:#e89050;--g-world:#c49868;--g-other:#888;
}
html[data-theme="light"]{
 --bg:#f5f5f5;--bg2:#ffffff;--bg3:#ebebeb;--card:#ffffff;--card-hover:#f0f0f0;
 --border:#d8d8d8;--text:#1a1a1a;--muted:#666;--accent:#d4a014;
 --keeper:#d4a014;--keeper-bg:rgba(245,197,24,.15);
 --red:#d9534f;--green:#2fa151;--blue:#2273c9;--purple:#8e44ad;
 --map-land:#d0d0d0;--map-land-active:#d4a014;--map-border:#aaa;--map-ocean:#eaeaea;
 --g-electronic:#2273c9;--g-folk:#3a8c3a;--g-jazz:#8e44ad;--g-metal:#c44040;
 --g-pop:#c4a014;--g-rock:#c66420;--g-world:#8a6030;--g-other:#777;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;
 -webkit-font-smoothing:antialiased;overflow-x:hidden;
 transition:background .2s,color .2s}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--blue);text-decoration:none}

/* Header */
.app-header{background:var(--bg2);border-bottom:1px solid var(--border);
 padding:10px 16px;position:sticky;top:0;z-index:100}
.app-header-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.app-title{font-size:18px;font-weight:600;display:flex;align-items:center;gap:10px;cursor:pointer}
.app-title .logo{width:26px;height:26px;background:var(--accent);border-radius:5px;
 display:flex;align-items:center;justify-content:center;color:var(--bg);font-weight:700;font-size:15px;
 font-family:Georgia,serif;font-style:italic}
.app-title .name{letter-spacing:.3px}
.app-title .tag{font-size:11px;color:var(--muted);font-weight:400;margin-left:4px;letter-spacing:.5px;text-transform:uppercase}
.header-actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{padding:6px 12px;border-radius:6px;background:var(--bg3);color:var(--text);
 font-size:13px;transition:background .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--border)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#000;font-weight:600}
.btn-primary:hover{opacity:.9}
.btn-icon{padding:6px 10px}

/* Tabs */
.year-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.year-tab{padding:8px 14px;border-radius:8px 8px 0 0;background:var(--bg3);color:var(--muted);
 font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:all .15s}
.year-tab:hover{background:var(--border);color:var(--text)}
.year-tab.active{background:var(--card);color:var(--text);border-bottom:2px solid var(--accent)}
.year-tab.special{border-bottom:2px solid transparent}
.year-tab.special.active{border-bottom-color:var(--purple)}
.year-tab .count{background:rgba(128,128,128,.15);padding:1px 7px;border-radius:10px;font-size:11px;
 display:flex;align-items:center;gap:3px}
.year-tab.active .count{background:var(--accent);color:#000}
.year-tab.special.active .count{background:var(--purple);color:#fff}
.year-tab .kcount{color:var(--keeper);font-weight:600}
.year-tab.active .kcount{color:#000}

/* Toolbar */
.toolbar{padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border);
 display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:88px;z-index:90;
 backdrop-filter:blur(8px)}
.search-wrap{flex:1;min-width:180px;position:relative}
.search{width:100%;padding:8px 12px 8px 34px;background:var(--bg3);border:1px solid var(--border);
 border-radius:6px;color:var(--text)}
.search:focus{outline:none;border-color:var(--accent)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.select{padding:7px 10px;background:var(--bg3);border:1px solid var(--border);
 border-radius:6px;color:var(--text)}
.chip{padding:6px 12px;border-radius:20px;background:var(--bg3);font-size:13px;
 transition:background .15s;color:var(--text)}
.chip:hover{background:var(--border)}
.chip.active{background:var(--accent);color:#000;font-weight:600}
.view-toggle{display:flex;gap:2px;background:var(--bg3);padding:2px;border-radius:6px;border:1px solid var(--border)}
.view-toggle button{padding:5px 10px;border-radius:4px;font-size:13px;color:var(--muted);transition:all .15s}
.view-toggle button.active{background:var(--accent);color:#000}

.main{padding:14px 16px 80px;max-width:1400px;margin:0 auto}
/* Fade-in animation on view switches */
.main{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.section-header{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px;padding:0 2px}
.section-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.section-title.main{font-size:15px}

/* Cards — list view */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;
 padding:10px;display:flex;gap:10px;position:relative;transition:all .15s;user-select:none;
 overflow:hidden}
.card:hover{background:var(--card-hover);border-color:#4a4a4a}
.card.keeper{border-left:3px solid var(--keeper);background:var(--keeper-bg)}
.card.keeper::before{content:'';position:absolute;inset:0;
 background:linear-gradient(120deg,transparent 40%,rgba(245,197,24,.08) 50%,transparent 60%);
 opacity:0;transition:opacity .3s;pointer-events:none}
.card.keeper:hover::before{opacity:1;animation:shimmerSlide 1.2s ease}
@keyframes shimmerSlide{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.card.dragging{opacity:.4}
.card.drag-over{border-top:2px solid var(--accent)}
.card.tolisten{border-left:3px solid var(--purple)}

.cover{width:64px;height:64px;min-width:64px;border-radius:6px;background:var(--bg3);
 display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--muted);
 overflow:hidden;position:relative;cursor:pointer;transition:transform .1s}
.cover:hover{transform:scale(1.04)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.loading::after{content:"";position:absolute;inset:0;
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);
 animation:shimmer 1.2s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
/* Procedural placeholder */
.cover.placeholder{background:var(--ph-bg,#444);color:rgba(255,255,255,.95);font-weight:700;
 font-size:22px;font-family:Georgia,serif;letter-spacing:-.5px}

.card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.card-title{font-weight:600;font-size:14px;line-height:1.3;
 overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card-artist{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:11px;padding:2px 7px 2px 10px;border-radius:10px;background:var(--bg3);
 color:var(--muted);position:relative}
.tag.genre{color:var(--text);padding-left:12px}
.tag.genre::before{content:'';position:absolute;left:3px;top:50%;transform:translateY(-50%);
 width:3px;height:12px;border-radius:2px;background:var(--genre-color,var(--g-other))}
.tag.country{color:var(--green)}
.card-notes{font-size:12px;color:var(--muted);font-style:italic;margin-top:4px;
 overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.card-actions{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.keeper-btn{width:30px;height:30px;border-radius:50%;background:transparent;
 display:flex;align-items:center;justify-content:center;font-size:16px;
 transition:all .15s;opacity:.25;filter:grayscale(1)}
.keeper-btn:hover{opacity:.6;background:var(--bg3)}
.keeper-btn.active{opacity:1;filter:none;color:var(--keeper);text-shadow:0 0 8px rgba(245,197,24,.5)}
.keeper-btn.active:hover{background:var(--bg3)}
.edit-btn,.move-btn{width:30px;height:30px;border-radius:50%;background:transparent;color:var(--muted);
 display:flex;align-items:center;justify-content:center;font-size:12px;opacity:.5;transition:all .15s}
.edit-btn:hover,.move-btn:hover{opacity:1;background:var(--bg3)}
.move-btn{color:var(--green);font-size:14px}

/* WALL / GRID view */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.wall-card{background:var(--card);border-radius:8px;overflow:hidden;cursor:pointer;
 transition:transform .15s,box-shadow .15s;position:relative;user-select:none}
.wall-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.wall-card.keeper::after{content:'⭐';position:absolute;top:8px;right:8px;z-index:2;
 background:rgba(245,197,24,.95);color:#000;width:26px;height:26px;border-radius:50%;
 display:flex;align-items:center;justify-content:center;font-size:14px;
 box-shadow:0 2px 6px rgba(0,0,0,.3)}
.wall-cover{aspect-ratio:1;background:var(--bg3);overflow:hidden;position:relative;
 display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--muted)}
.wall-cover img{width:100%;height:100%;object-fit:cover}
.wall-cover.loading::after{content:"";position:absolute;inset:0;
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);
 animation:shimmer 1.2s infinite}
.wall-cover.placeholder{background:var(--ph-bg,#444);color:rgba(255,255,255,.95);
 font-weight:700;font-size:46px;font-family:Georgia,serif;letter-spacing:-1px}
.wall-info{padding:8px 10px}
.wall-title{font-weight:600;font-size:13px;line-height:1.25;
 overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wall-artist{font-size:12px;color:var(--muted);margin-top:2px;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .big{font-size:48px;margin-bottom:12px;opacity:.5}
.empty .btn{margin-top:16px;display:inline-block}

/* Modals */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;
 display:none;align-items:center;justify-content:center;padding:16px}
.modal-backdrop.show{display:flex}
.modal{background:var(--bg2);border-radius:10px;max-width:520px;width:100%;
 max-height:90vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.modal-header{padding:16px;border-bottom:1px solid var(--border);
 display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:16px;font-weight:600}
.modal-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.modal-footer{padding:12px 16px;border-top:1px solid var(--border);
 display:flex;justify-content:flex-end;gap:8px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{padding:8px 10px;background:var(--bg3);
 border:1px solid var(--border);border-radius:6px;color:var(--text)}
.field textarea{resize:vertical;min-height:60px;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field-inline{display:flex;align-items:center;gap:8px}
.field-inline input[type=checkbox]{width:18px;height:18px;cursor:pointer}

/* Detail view */
.detail-cover{width:100%;max-width:240px;aspect-ratio:1;border-radius:10px;
 background:var(--bg3);margin:0 auto;overflow:hidden;display:flex;align-items:center;
 justify-content:center;font-size:60px;color:var(--muted)}
.detail-cover.placeholder{background:var(--ph-bg,#444);color:rgba(255,255,255,.95);
 font-weight:700;font-size:90px;font-family:Georgia,serif;letter-spacing:-2px}
.detail-cover img{width:100%;height:100%;object-fit:cover}
.detail-title{font-size:22px;font-weight:700;text-align:center;margin-top:12px;line-height:1.2}
.detail-artist{font-size:16px;color:var(--muted);text-align:center;margin-top:4px}
.detail-meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.detail-notes{background:var(--bg3);padding:10px 12px;border-radius:8px;
 font-style:italic;color:var(--text);margin-top:12px;font-size:13px}
.detail-actions{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.similar-section{margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.similar-title{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;
 letter-spacing:.5px;margin-bottom:8px}
.similar-list{display:flex;flex-direction:column;gap:6px}
.similar-item{display:flex;gap:8px;padding:6px;border-radius:6px;cursor:pointer;transition:background .15s;
 align-items:center}
.similar-item:hover{background:var(--bg3)}
.similar-cover{width:36px;height:36px;min-width:36px;border-radius:4px;background:var(--bg3);
 display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);overflow:hidden}
.similar-cover img{width:100%;height:100%;object-fit:cover}
.similar-info{flex:1;min-width:0}
.similar-item-title{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.similar-item-artist{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.stat-value{font-size:26px;font-weight:700}
.stat-value.keeper{color:var(--keeper)}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:10px;
 padding:16px;margin-bottom:12px}
.chart-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;
 letter-spacing:.5px;margin-bottom:12px;display:flex;justify-content:space-between;
 align-items:baseline;gap:8px;flex-wrap:wrap}
.chart-title .sub{text-transform:none;letter-spacing:0;color:var(--muted);font-weight:400;font-size:12px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;cursor:pointer}
.bar-row:hover .bar-label{color:var(--text)}
.bar-label{width:140px;min-width:140px;color:var(--muted);overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap;transition:color .15s}
.bar-track{flex:1;height:18px;background:var(--bg3);border-radius:3px;overflow:hidden;position:relative}
.bar-fill{height:100%;background:var(--accent);transition:width .3s}
.bar-value{width:50px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

/* World map */
.map-wrap{position:relative;width:100%;aspect-ratio:2/1;background:var(--map-ocean);
 border-radius:8px;overflow:hidden}
.map-svg{width:100%;height:100%;display:block}
.map-country-path{fill:var(--map-land);stroke:var(--map-border);stroke-width:.3;
 transition:fill .2s,opacity .2s;cursor:default}
.map-country-path.active{fill:var(--map-land-active);cursor:pointer}
.map-country-path.active:hover{opacity:.75}
.map-loading{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);gap:8px}
.map-legend{display:flex;align-items:center;gap:14px;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.map-legend .swatch{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:4px;vertical-align:middle}
#map-tooltip{position:absolute;background:var(--bg);border:1px solid var(--border);
 padding:6px 10px;border-radius:6px;font-size:12px;pointer-events:none;display:none;z-index:10;
 box-shadow:0 2px 8px rgba(0,0,0,.3)}

/* Discover mode (full-screen album browser) */
.discover{position:fixed;inset:0;background:var(--bg);z-index:500;display:none;
 flex-direction:column;align-items:center;justify-content:center;padding:20px;
 animation:fadeIn .25s ease}
.discover.show{display:flex}
.discover-topbar{position:absolute;top:0;left:0;right:0;padding:12px 16px;
 display:flex;justify-content:space-between;align-items:center;gap:8px;background:linear-gradient(to bottom,var(--bg),transparent);z-index:2}
.discover-close{width:36px;height:36px;border-radius:50%;background:var(--bg3);
 display:flex;align-items:center;justify-content:center;font-size:18px}
.discover-scope{padding:6px 12px;border-radius:20px;background:var(--bg3);color:var(--text);
 font-size:13px;border:1px solid var(--border)}
.discover-counter{color:var(--muted);font-size:12px}
.discover-card{max-width:380px;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
.discover-cover{width:100%;max-width:320px;aspect-ratio:1;border-radius:12px;background:var(--bg3);
 overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.4);
 display:flex;align-items:center;justify-content:center;font-size:80px;color:var(--muted)}
.discover-cover.placeholder{background:var(--ph-bg,#444);color:rgba(255,255,255,.95);
 font-weight:700;font-size:120px;font-family:Georgia,serif;letter-spacing:-3px}
.discover-cover img{width:100%;height:100%;object-fit:cover}
.discover-title{font-size:20px;font-weight:700;text-align:center;line-height:1.25;padding:0 12px}
.discover-artist{font-size:15px;color:var(--muted);text-align:center}
.discover-meta{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.discover-notes{font-size:13px;font-style:italic;color:var(--muted);text-align:center;
 max-width:320px;padding:0 12px}
.discover-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center}
.discover-nav{position:absolute;top:50%;transform:translateY(-50%);
 width:48px;height:48px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);
 display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--text);
 transition:all .15s;z-index:3}
.discover-nav:hover{background:var(--border);transform:translateY(-50%) scale(1.08)}
.discover-nav.prev{left:20px}
.discover-nav.next{right:20px}
.discover-hint{position:absolute;bottom:16px;font-size:11px;color:var(--muted);text-align:center;width:100%;left:0}

/* Confetti */
.confetti-piece{position:fixed;width:10px;height:14px;background:var(--accent);z-index:900;
 pointer-events:none;opacity:.95;border-radius:2px}

/* FAB */
.fab{position:fixed;bottom:20px;right:20px;width:44px;height:44px;border-radius:50%;
 background:var(--accent);color:#000;font-size:20px;font-weight:bold;
 display:flex;align-items:center;justify-content:center;
 box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:50;opacity:0;pointer-events:none;
 transition:opacity .2s,transform .2s}
.fab.show{opacity:1;pointer-events:auto}
.fab:hover{transform:scale(1.08)}

.sync-status-pill{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;
 border-radius:14px;font-size:12px;background:var(--bg3);color:var(--muted);transition:all .2s}
.sync-status-pill.active{color:var(--green)}
.sync-status-pill.syncing{color:var(--blue)}
.sync-status-pill.error{color:var(--red)}
.sync-status-pill.offline{color:var(--muted)}
.sync-step{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:8px;
 background:var(--bg3);border:1px solid var(--border);margin-bottom:8px}
.sync-step .num{width:24px;height:24px;background:var(--accent);color:#000;border-radius:50%;
 display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.sync-step .body{flex:1;font-size:13px}
.sync-step .body strong{display:block;margin-bottom:3px;color:var(--text)}
.sync-step .body code{background:var(--bg);padding:1px 6px;border-radius:3px;font-size:12px;color:var(--accent)}
.sync-info-box{padding:10px 12px;border-radius:8px;background:var(--keeper-bg);
 border:1px solid var(--keeper);font-size:13px;margin-bottom:10px;color:var(--text)}
.sync-info-box.warning{background:rgba(232,90,90,.08);border-color:var(--red);color:var(--text)}
.sync-info-box.success{background:rgba(90,191,110,.08);border-color:var(--green);color:var(--text)}
.discogs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.discogs-result{aspect-ratio:1;background:var(--bg3);border-radius:6px;cursor:pointer;
 overflow:hidden;position:relative;transition:transform .15s,box-shadow .15s;
 display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.discogs-result:hover{transform:scale(1.04);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.discogs-result img{width:100%;height:100%;object-fit:cover}
.discogs-result .label{position:absolute;bottom:0;left:0;right:0;
 background:linear-gradient(transparent,rgba(0,0,0,.85));padding:14px 6px 4px;
 color:#fff;font-size:10px;line-height:1.2;text-align:center}
.discogs-loading{text-align:center;padding:30px;color:var(--muted)}
@media (max-width:640px){.discogs-grid{grid-template-columns:repeat(2,1fr)}}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);
 background:var(--bg3);padding:10px 18px;border-radius:20px;
 box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:800;
 transition:transform .3s;font-size:13px;border:1px solid var(--border)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* Mobile */
@media (max-width:640px){
 .app-header{padding:8px 10px}
 .app-title{font-size:16px}
 .app-title .tag{display:none}
 .main{padding:10px 10px 80px}
 .cards{grid-template-columns:1fr;gap:8px}
 .wall{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
 .card{padding:8px}
 .cover{width:60px;height:60px;min-width:60px}
 .toolbar{padding:8px 10px;gap:6px;top:82px}
 .btn{padding:6px 10px;font-size:12px}
 .year-tabs{gap:6px;padding:2px 0 4px}
 .year-tab{padding:9px 13px;font-size:14px;min-height:38px;gap:7px}
 .year-tab .year-full{display:none}
 .year-tab .year-short{display:inline}
 /* Hide keeper count badge on year tabs (mobile only) — show only album count */
 .year-tab .keeper-sep{display:none}
 .year-tab .count{font-size:12px;padding:1px 8px}
 .bar-label{width:90px;min-width:90px;font-size:12px}
 .discover-nav{width:40px;height:40px;font-size:18px}
 .discover-nav.prev{left:10px}
 .discover-nav.next{right:10px}
 .discover-cover{max-width:280px}
}
@media (min-width:641px){.year-tab .year-short{display:none}}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>
<body>

<div class="app-header">
 <div class="app-header-top">
  <div class="app-title" id="app-title">
    <span class="logo">O</span>
    <span class="name">Ostinato</span>
    <span class="tag">Music, kept.</span>
  </div>
  <div class="header-actions">
   <button class="btn" id="btn-explore" title="Rediscover — browse forgotten albums">🎲</button>
   <button class="btn" id="btn-stats" title="Stats">📊</button>
   <button class="btn" id="btn-add" title="Add album">+</button>
   <button class="btn btn-icon" id="btn-theme" title="Toggle theme">🌙</button>
   <button class="btn btn-icon" id="btn-sync-status" title="Sync status" style="display:none">☁️</button>
   <button class="btn btn-icon" id="btn-menu" title="More">⋮</button>
  </div>
 </div>
 <div class="year-tabs" id="year-tabs"></div>
</div>

<div class="toolbar">
 <div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input type="text" class="search" id="search" placeholder="Search artist, title, genre, label, country, notes...">
 </div>
 <button class="chip active" data-filter="all">All</button>
 <button class="chip" data-filter="keepers">⭐ Keepers</button>
 <select class="select" id="sort">
  <option value="custom">Custom order</option>
  <option value="added-desc">Recently added (new→old)</option>
  <option value="added">Date added (old→new)</option>
  <option value="artist">Artist A→Z</option>
  <option value="artist-desc">Artist Z→A</option>
  <option value="title">Title A→Z</option>
  <option value="year-desc">Year (new→old)</option>
  <option value="year">Year (old→new)</option>
  <option value="genre">Genre</option>
  <option value="label">Label</option>
 </select>
 <select class="select" id="group">
  <option value="none">No grouping</option>
  <option value="genre">By Genre</option>
  <option value="country">By Country</option>
  <option value="label">By Label</option>
  <option value="release_year">By Release Year</option>
 </select>
 <div class="view-toggle" title="Switch layout">
  <button id="view-list" class="active">☰</button>
  <button id="view-wall">▦</button>
 </div>
</div>

<div class="main" id="main"></div>

<!-- Edit modal -->
<div class="modal-backdrop" id="modal">
 <div class="modal">
  <div class="modal-header">
   <div class="modal-title" id="modal-title">Edit Album</div>
   <button class="btn-icon" onclick="closeModal()">✕</button>
  </div>
  <div class="modal-body">
   <div class="field"><label>Artist</label><input id="f-artist" type="text" autocomplete="off"></div>
   <div class="field"><label>Title</label><input id="f-title" type="text" autocomplete="off"></div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div class="field"><label>Genre</label><input id="f-genre" type="text" list="genre-list" autocomplete="off"></div>
    <div class="field"><label>Release Year <span style="color:var(--muted);font-weight:400;text-transform:none">(auto-filled when possible)</span></label><input id="f-release-year" type="number"></div>
   </div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div class="field"><label>Country</label><input id="f-country" type="text" list="country-list" autocomplete="off"></div>
    <div class="field"><label>Label</label><input id="f-label" type="text" list="label-list" autocomplete="off"></div>
   </div>
   <div class="field" id="f-listen-wrap"><label>Listen Year</label><input id="f-listen-year" type="number"></div>
   <div class="field"><label>Notes</label><textarea id="f-notes"></textarea></div>
   <div class="field">
    <label>Cover image URL <span style="color:var(--muted);font-weight:400;text-transform:none">(optional — overrides auto-fetch)</span></label>
    <div style="display:flex;gap:6px;align-items:stretch">
      <input id="f-cover-url" type="text" placeholder="https://..." style="flex:1" autocomplete="off">
      <button type="button" class="btn" onclick="openDiscogsSearch()" title="Search Discogs covers">🔍 Discogs</button>
    </div>
    <div id="f-cover-preview" style="margin-top:6px;display:none">
      <img id="f-cover-preview-img" style="max-width:80px;max-height:80px;border-radius:4px;border:1px solid var(--border)">
      <button type="button" class="btn btn-icon" onclick="clearCoverUrl()" style="margin-left:6px;font-size:12px">Clear</button>
    </div>
   </div>
   <div class="field-inline" id="f-keeper-wrap"><input type="checkbox" id="f-keeper"><label for="f-keeper" style="font-size:14px;color:var(--text);text-transform:none;letter-spacing:0">⭐ Keeper</label></div>
  </div>
  <div class="modal-footer">
   <button class="btn" id="btn-delete" style="margin-right:auto;color:var(--red)">Delete</button>
   <button class="btn" onclick="closeModal()">Cancel</button>
   <button class="btn btn-primary" id="btn-save">Save</button>
  </div>
 </div>
</div>

<!-- Detail modal -->
<div class="modal-backdrop" id="detail-modal">
 <div class="modal" id="detail-modal-inner"></div>
</div>

<!-- Move modal -->
<div class="modal-backdrop" id="move-modal">
 <div class="modal" style="max-width:380px">
  <div class="modal-header">
   <div class="modal-title">Mark as listened</div>
   <button class="btn-icon" onclick="closeMove()">✕</button>
  </div>
  <div class="modal-body">
   <div class="field"><label>Which year did you listen?</label>
    <select id="move-year" class="select">
     <option value="2026">2026</option><option value="2025">2025</option>
     <option value="2024">2024</option><option value="2023">2023</option>
     <option value="2022">2022</option><option value="2021">2021</option>
    </select>
   </div>
   <div class="field-inline"><input type="checkbox" id="move-keeper"><label for="move-keeper" style="font-size:14px;color:var(--text);text-transform:none;letter-spacing:0">⭐ Mark as keeper</label></div>
  </div>
  <div class="modal-footer">
   <button class="btn" onclick="closeMove()">Cancel</button>
   <button class="btn btn-primary" id="btn-move-confirm">Move to year</button>
  </div>
 </div>
</div>

<!-- Discogs cover search modal -->
<div class="modal-backdrop" id="discogs-modal">
 <div class="modal" style="max-width:520px">
  <div class="modal-header">
   <div class="modal-title">🔍 Search Discogs covers</div>
   <button class="btn-icon" onclick="closeDiscogsModal()">✕</button>
  </div>
  <div class="modal-body" id="discogs-modal-body"></div>
 </div>
</div>

<!-- Sync setup modal -->
<div class="modal-backdrop" id="sync-modal">
 <div class="modal" style="max-width:480px">
  <div class="modal-header">
   <div class="modal-title" id="sync-modal-title">☁️ Cross-device Sync</div>
   <button class="btn-icon" onclick="closeSyncModal()">✕</button>
  </div>
  <div class="modal-body" id="sync-modal-body">
   <!-- Content rendered dynamically -->
  </div>
 </div>
</div>

<!-- Menu modal -->
<div class="modal-backdrop" id="menu-modal">
 <div class="modal" style="max-width:380px">
  <div class="modal-header">
   <div class="modal-title">Menu</div>
   <button class="btn-icon" onclick="closeMenu()">✕</button>
  </div>
  <div class="modal-body">
   <button class="btn" onclick="openSyncModal()" id="btn-sync-menu">☁️ Set up sync</button>
   <button class="btn" onclick="warmCovers()" id="btn-warm">🖼️ Pre-fetch all covers</button>
   <button class="btn" onclick="generateShareImage()">📸 Year in review (image)</button>
   <button class="btn" onclick="exportJSON()">💾 Export JSON backup</button>
   <button class="btn" onclick="exportCSV()">📤 Export CSV</button>
   <button class="btn" onclick="document.getElementById('import-file').click()">📥 Import JSON</button>
   <input type="file" id="import-file" accept=".json" style="display:none">
   <button class="btn" onclick="clearCoverCache()">🗑️ Clear cover cache</button>
   <button class="btn" onclick="resetData()" style="color:var(--red)">♻️ Reset to original data</button>
   <div style="font-size:12px;color:var(--muted);margin-top:10px;text-align:center">
    Ostinato v8 · Local + cloud sync
   </div>
  </div>
 </div>
</div>

<!-- Discover mode (full-screen) -->
<div class="discover" id="discover">
 <div class="discover-topbar">
  <button class="discover-close" onclick="closeDiscover()">✕</button>
  <select class="discover-scope" id="discover-scope">
    <option value="keepers-all">⭐ All keepers</option>
    <option value="all-all">All albums</option>
    <option value="keepers-year">⭐ Keepers (current year)</option>
    <option value="all-year">All albums (current year)</option>
  </select>
  <span class="discover-counter" id="discover-counter">— / —</span>
 </div>
 <button class="discover-nav prev" onclick="discoverNav(-1)" title="Previous (←)">‹</button>
 <div class="discover-card" id="discover-card"></div>
 <button class="discover-nav next" onclick="discoverNav(1)" title="Next (→)">›</button>
 <div class="discover-hint" id="discover-hint">← → arrows · swipe on mobile · S to keep · Esc to exit</div>
</div>

<!-- Share canvas (off-screen) -->
<canvas id="share-canvas" width="1080" height="1080" style="display:none"></canvas>

<button class="fab" id="fab-top" title="Back to top">↑</button>
<div class="toast" id="toast"></div>

<datalist id="country-list"></datalist>
<datalist id="genre-list"></datalist>
<datalist id="label-list"></datalist>

}

/* ============= PROCEDURAL COVER PLACEHOLDERS ============= */
function hashStr(s){
  let h = 0;
  for(let i=0;i<s.length;i++){ h = ((h<<5) - h + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function placeholderStyle(artist, title){
  const h = hashStr((artist||'')+(title||''));
  const hue = h % 360;
  const hue2 = (hue + 40 + (h>>8)%80) % 360;
  const sat1 = 45 + (h>>3)%20;
  const sat2 = 40 + (h>>5)%20;
  const lum1 = 30 + (h>>7)%15;
  const lum2 = 20 + (h>>11)%10;
  return `linear-gradient(135deg, hsl(${hue},${sat1}%,${lum1}%), hsl(${hue2},${sat2}%,${lum2}%))`;
}
function placeholderLetter(artist, title){
  const src = (artist||title||'').trim();
  if(!src) return '♪';
  const ch = src[0].toUpperCase();
  return /[A-Z0-9]/.test(ch) ? ch : '♪';
}

/* ============= STORAGE ============= */
function loadData(){
  try { const s = localStorage.getItem(STORAGE_KEY);
    state.albums = s ? JSON.parse(s) : JSON.parse(JSON.stringify(ORIGINAL_DATA));
  } catch(e){ state.albums = JSON.parse(JSON.stringify(ORIGINAL_DATA)); }
  try { const t = localStorage.getItem(TOLISTEN_KEY);
    state.toListen = t ? JSON.parse(t) : [];
  } catch(e){ state.toListen = []; }
  try { const v = localStorage.getItem(VIEW_KEY); if(v) state.layout = v; } catch(e){}
  backfillCreatedAt();
  // Seed cover cache from any manual coverUrl values
  if(typeof seedCoverCacheFromAlbums === 'function') seedCoverCacheFromAlbums();
}
function backfillCreatedAt(){
  // Albums missing createdAt → synthesize from listen_year + order so original Excel order is preserved
  // Synthetic timestamp: Jan 1 of listen_year + (order * 1 minute) — guarantees uniqueness + ordering
  let mutated = false;
  for(const a of state.albums){
    if(!a.createdAt){
      const yr = a.listen_year || 2020;
      const ord = a.order || 0;
      a.createdAt = new Date(yr, 0, 1).getTime() + ord * 60000;
      mutated = true;
    }
  }
  for(const a of state.toListen){
    if(!a.createdAt){ a.createdAt = (a.order || 0) * 60000 + 1577836800000; mutated = true; }
  }
  if(mutated){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.albums)); } catch(e){}
    try { localStorage.setItem(TOLISTEN_KEY, JSON.stringify(state.toListen)); } catch(e){}
  }
}

}

function yearCount(y){ return state.albums.filter(a=>a.listen_year===y).length; }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normalizeCountry(c){
  if(!c) return null;
  return COUNTRY_MAP[c] || COUNTRY_MAP[c.toUpperCase()] || COUNTRY_MAP[c.trim()] || null;
}
function ytMusicUrl(artist, title){
  return `https://music.youtube.com/search?q=${encodeURIComponent((artist||'')+' '+(title||''))}`;
}
function coverKey(artist, title){
  return ((artist||'')+'|'+(title||'')).toLowerCase().replace(/\s+/g,' ').trim();

/* ============= CONFETTI ============= */
function confettiBurst(x, y){
  const colors = ['#f5c518','#5a9ae8','#5abf6e','#e85a5a','#b87bd9'];
  for(let i=0;i<18;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.background = colors[i % colors.length];
    const angle = (Math.PI * 2 * i / 18) + (Math.random() * 0.5);
    const vel = 80 + Math.random() * 120;
    const dx = Math.cos(angle) * vel;
    const dy = Math.sin(angle) * vel - 80;
    document.body.appendChild(p);
    p.animate([
      { transform: 'translate(0,0) rotate(0)', opacity: 1 },
      { transform: `translate(${dx}px, ${dy + 300}px) rotate(${Math.random()*720}deg)`, opacity: 0 }
    ], { duration: 900 + Math.random()*400, easing: 'cubic-bezier(.2,.8,.4,1)' });
    setTimeout(()=>p.remove(), 1400);
  }
}

/* ============= COVERS ============= */
async function fetchCoveriTunes(artist, title){
  try {
    const q = encodeURIComponent(`${artist} ${title}`.trim());
    const url = `https://itunes.apple.com/search?term=${q}&entity=album&limit=1`;
    const r = await fetch(url);
    if(!r.ok) return null;
    const data = await r.json();
    if(!data.results || !data.results.length) return null;
    const hit = data.results[0];
    const ha = (hit.artistName||'').toLowerCase();
    const ht = (hit.collectionName||'').toLowerCase();
    const qa = (artist||'').toLowerCase();
    const qt = (title||'').toLowerCase();
    const aMatch = ha.includes(qa.slice(0,6)) || qa.includes(ha.slice(0,6));
    const tMatch = ht.includes(qt.slice(0,6)) || qt.includes(ht.slice(0,6));
    if(!aMatch && !tMatch) return null;
    return (hit.artworkUrl100||'').replace('100x100bb','400x400bb') || null;
  } catch(e){ return null; }
}
async function fetchCoverMB(artist, title){
  try {
    const esc = s => (s||'').replace(/[+\-&|!(){}\[\]^"~*?:\\/]/g,' ');
    const q = `artist:"${esc(artist)}" AND release:"${esc(title)}"`;
    const url = `https://musicbrainz.org/ws/2/release-group/?query=${encodeURIComponent(q)}&fmt=json&limit=1`;
    const r = await fetch(url, {headers:{'Accept':'application/json'}});
    if(!r.ok) return null;
    const data = await r.json();
    const rg = data['release-groups'] && data['release-groups'][0];
    if(!rg || (rg.score||0) < 70) return null;
    return `https://coverartarchive.org/release-group/${rg.id}/front-250`;
  } catch(e){ return null; }
}
async function fetchCover(artist, title){
  const k = coverKey(artist, title);
  if(coverCache[k] !== undefined) return coverCache[k];
  if(!artist && !title){ coverCache[k] = null; return null; }
  let url = await fetchCoveriTunes(artist, title);
  if(!url) url = await fetchCoverMB(artist, title);
  coverCache[k] = url || null;
  if(!fetchCover._t){
    fetchCover._t = setTimeout(()=>{ saveCovers(); fetchCover._t=null; }, 1500);
  }
  return coverCache[k];
}

let coverObserver = null;
function lazyLoadCovers(){
  if(coverObserver) coverObserver.disconnect();
  coverObserver = new IntersectionObserver(entries => {
    entries.forEach(async entry => {
      if(!entry.isIntersecting) return;
      const el = entry.target;
      coverObserver.unobserve(el);
      const a = el.dataset.artist, t = el.dataset.title;
      el.classList.add('loading');
      const url = await fetchCover(a, t);
      el.classList.remove('loading');
      if(url && el.isConnected){
        const img = new Image();
        img.onload = ()=>{ 
          el.innerHTML=''; 
          el.classList.remove('placeholder');
          el.style.background = ''; 
          el.appendChild(img); 
        };
        img.onerror = ()=>{ coverCache[coverKey(a,t)]=null; saveCovers(); };
        img.src = url; img.alt = '';
      }
    });
  }, {rootMargin:'300px'});
  document.querySelectorAll('.cover[data-artist],.wall-cover[data-artist]').forEach(c => coverObserver.observe(c));
}

async function warmCovers(){
  if(warming){ toast('Already warming...'); return; }
  warming = true; closeMenu();
  const btn = document.getElementById('btn-warm');
  btn.textContent = '⏳ Warming... 0%';
  const seen = new Set();
  const queue = [];
  for(const a of [...state.albums, ...state.toListen]){
    const k = coverKey(a.artist, a.title);
    if(seen.has(k) || coverCache[k] !== undefined) continue;
    seen.add(k);
    queue.push(a);
  }
  if(queue.length === 0){
    toast('All covers already cached ✓');
    btn.textContent = '🖼️ Pre-fetch all covers'; warming = false; return;
  }
  toast(`Fetching ${queue.length} covers...`);
  let done = 0;
  const BATCH = 4;
  for(let i = 0; i < queue.length; i += BATCH){
    const slice = queue.slice(i, i+BATCH);
    await Promise.all(slice.map(q => fetchCover(q.artist, q.title)));
    done += slice.length;
    btn.textContent = `⏳ Warming... ${Math.round(done/queue.length*100)}%`;
    await new Promise(r => setTimeout(r, 100));
  }
  saveCovers();
  const hits = Object.values(coverCache).filter(v=>v).length;
  toast(`✓ Cached ${hits} covers`);
  btn.textContent = '🖼️ Pre-fetch all covers';
  warming = false;
  render();
}
function clearCoverCache(){
  if(!confirm('Clear all cached album covers?')) return;
  coverCache = {}; localStorage.removeItem(COVER_KEY);
  closeMenu(); toast('Cover cache cleared'); render();
}

/* ============= GEOJSON WORLD MAP ============= */
async function loadGeoJSON(){
  if(geoData || geoLoading) return;
  geoLoading = true;
  try {
    const cached = localStorage.getItem(GEOJSON_KEY);
    if(cached){ geoData = JSON.parse(cached); geoLoading=false; return; }
  } catch(e){}
  const sources = [
    'https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json',
    'https://cdn.jsdelivr.net/gh/johan/world.geo.json@master/countries.geo.json',
  ];
  for(const url of sources){
    try {
      const r = await fetch(url);
      if(!r.ok) continue;
      const data = await r.json();
      geoData = data;
      try { localStorage.setItem(GEOJSON_KEY, JSON.stringify(data)); } catch(e){}
      geoLoading = false;
      return;
    } catch(e){}
  }
  geoLoading = false;
}

/* ============= FILTER + SORT ============= */
function filterAndSort(list){
  let out = list.slice();
  if(state.filter === 'keepers') out = out.filter(a => a.keeper);
  if(state.countryFilter){
    out = out.filter(a => normalizeCountry(a.country) === state.countryFilter);
  }
  if(state.search){
    const q = state.search.toLowerCase();
    out = out.filter(a =>
      (a.artist||'').toLowerCase().includes(q) ||
      (a.title||'').toLowerCase().includes(q) ||
      (a.genre||'').toLowerCase().includes(q) ||
      (a.label||'').toLowerCase().includes(q) ||
      (a.country||'').toLowerCase().includes(q) ||
      (a.notes||'').toLowerCase().includes(q)
    );
  }
  const cmp = {
    'custom': (a,b) => a.order - b.order,
    'added-desc': (a,b) => (b.createdAt||0) - (a.createdAt||0),
    'added': (a,b) => (a.createdAt||0) - (b.createdAt||0),
    'artist': (a,b) => (a.artist||'').localeCompare(b.artist||''),
    'artist-desc': (a,b) => (b.artist||'').localeCompare(a.artist||''),
    'title': (a,b) => (a.title||'').localeCompare(b.title||''),
    'year-desc': (a,b) => (b.release_year||0) - (a.release_year||0),
    'year': (a,b) => (a.release_year||0) - (b.release_year||0),
    'genre': (a,b) => (a.genre||'').localeCompare(b.genre||''),
    'label': (a,b) => (a.label||'').localeCompare(b.label||''),
  }[state.sort];
  if(cmp) out.sort(cmp);
  return out;
}

function cardHtml(a, isToListen){

    tags.push(`<span class="tag genre" style="--genre-color:${color}">${escapeHtml(a.genre)}</span>`);

  if(a.release_year) tags.push(`<span class="tag">${a.release_year}</span>`);

/* ============= CARD HANDLERS + DRAG ============= */
function attachCardHandlers(){
  document.querySelectorAll('.card, .wall-card').forEach(card => {
    card.addEventListener('click', (e) => {
      const target = e.target.closest('[data-action]');
      if(!target) return;
      const action = target.dataset.action;
      const id = card.dataset.id;
      const source = card.dataset.source;
      const list = source === 'tolisten' ? state.toListen : state.albums;
      const a = list.find(x => x.id === id);
      if(!a) return;
      if(action === 'music'){
        window.open(ytMusicUrl(a.artist, a.title), '_blank');
      } else if(action === 'keeper'){
        const wasKeeper = a.keeper;
        a.keeper = !a.keeper;
        saveData();
        if(!wasKeeper){
          const r = target.getBoundingClientRect();
          confettiBurst(r.left + r.width/2, r.top + r.height/2);
        }
        render();
      } else if(action === 'edit'){
        openEditModal(id, source);
      } else if(action === 'detail'){
        openDetailModal(id, source);
      } else if(action === 'move'){
        openMoveModal(id);
      }
    });
    // Drag only for list cards in 'albums' view with custom sort
    if(card.classList.contains('wall-card')) return;
    const source = card.dataset.source;
    const dragEnabled = source==='albums' && state.layout==='list' && state.sort==='custom' && state.group==='none'
                        && !state.countryFilter && !state.search && state.filter==='all' && state.view==='albums';
    const dragEnabledTL = source==='tolisten' && state.sort==='custom' && !state.search;
    const dragOn = dragEnabled || dragEnabledTL;
    card.draggable = dragOn;
    if(!dragOn) return;
    card.addEventListener('dragstart', (e) => {
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', card.dataset.id);
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      document.querySelectorAll('.drag-over').forEach(c => c.classList.remove('drag-over'));
    });
    card.addEventListener('dragover', (e) => {
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      card.classList.add('drag-over');
    });
    card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
    card.addEventListener('drop', (e) => {
      e.preventDefault();
      card.classList.remove('drag-over');
      const srcId = e.dataTransfer.getData('text/plain');
      const dstId = card.dataset.id;
      if(srcId === dstId) return;
      reorder(srcId, dstId, source);
    });
  });
}
function reorder(srcId, dstId, source){
  let list;
  if(source === 'tolisten'){
    list = state.toListen.slice().sort((a,b) => (a.order||0) - (b.order||0));
  } else {
    const year = state.currentYear;
    list = state.albums.filter(a => a.listen_year===year).sort((a,b) => a.order - b.order);
  }
  const si = list.findIndex(a => a.id===srcId);
  const di = list.findIndex(a => a.id===dstId);
  if(si<0 || di<0) return;
  const [m] = list.splice(si, 1);
  list.splice(di, 0, m);
  list.forEach((a, i) => { a.order = i; });
  if(source === 'tolisten') saveToListen(); else saveData();
  render();
  toast('Reordered');
}

  const list = source === 'tolisten' ? state.toListen : state.albums;
  const a = id ? list.find(x => x.id === id) : null;

      : (isToListen ? 'Add to listening list' : 'Add Album');

  document.getElementById('f-title').value = a?.title || '';
  document.getElementById('f-genre').value = a?.genre || '';
  document.getElementById('f-release-year').value = a?.release_year || '';
  document.getElementById('f-country').value = a?.country || '';
  document.getElementById('f-label').value = a?.label || '';
  document.getElementById('f-listen-year').value = a?.listen_year || state.currentYear || 2026;
  document.getElementById('f-notes').value = a?.notes || '';
  document.getElementById('f-keeper').checked = !!a?.keeper;
  document.getElementById('f-cover-url').value = a?.coverUrl || '';
  updateCoverPreview();

  document.getElementById('f-keeper-wrap').style.display = isToListen ? 'none' : '';

}
function closeModal(){ document.getElementById('modal').classList.remove('show'); editingId = null; }
function saveModal(){
  const isToListen = editingId && editingId.startsWith('tolisten:');
  const vals = {
    artist: document.getElementById('f-artist').value.trim(),
    title: document.getElementById('f-title').value.trim(),
    genre: document.getElementById('f-genre').value.trim(),
    release_year: parseInt(document.getElementById('f-release-year').value) || null,
    country: document.getElementById('f-country').value.trim(),
    label: document.getElementById('f-label').value.trim(),
    notes: document.getElementById('f-notes').value.trim(),
    coverUrl: document.getElementById('f-cover-url').value.trim(),
  };
  if(!isToListen){
    vals.listen_year = parseInt(document.getElementById('f-listen-year').value) || state.currentYear;
    vals.keeper = document.getElementById('f-keeper').checked;
  }
  if(!vals.artist && !vals.title){ toast('Artist or title required'); return; }
  const id = editingId.split(':')[1];
  if(id !== 'new'){
    const list = isToListen ? state.toListen : state.albums;
    const a = list.find(x => x.id === id);
    if(a) Object.assign(a, vals);
    toast('Saved');
  } else {
    if(isToListen){
      const maxOrder = state.toListen.length ? Math.max(...state.toListen.map(a => a.order||0)) : -1;
      const newId = `tl-${Date.now()}`;
      state.toListen.push({id: newId, order: maxOrder+1, keeper:false, createdAt: Date.now(), ...vals});
    } else {
      const yearAlbums = state.albums.filter(a => a.listen_year === vals.listen_year);
      const maxOrder = yearAlbums.length ? Math.max(...yearAlbums.map(a => a.order)) : -1;
      const newId = `${vals.listen_year}-new-${Date.now()}`;
      state.albums.push({id: newId, order: maxOrder+1, createdAt: Date.now(), ...vals});
      state.currentYear = vals.listen_year;
      state.view = 'albums';
    }
    toast('Added');
  }
  if(isToListen) saveToListen(); else saveData();
  // Apply manual coverUrl to the cover cache (overrides auto-fetch)
  if(vals.coverUrl){
    const k = coverKey(vals.artist, vals.title);
    coverCache[k] = vals.coverUrl;
    saveCovers();
  }
  populateDatalists();
  closeModal();
  render();
}
function deleteAlbum(){
  if(!editingId) return;
  const [source, id] = editingId.split(':');
  const isToListen = source === 'tolisten';
  if(!confirm(isToListen ? 'Remove from listening list?' : 'Delete this album?')) return;
  if(isToListen){
    state.toListen = state.toListen.filter(a => a.id !== id);
    saveToListen();
  } else {
    state.albums = state.albums.filter(a => a.id !== id);
    saveData();
  }
  closeModal(); render(); toast('Deleted');
}

/* ============= SIMILAR ALBUMS ============= */
function findSimilar(album, max=5){
  if(!album) return [];
  const targetGenre = (album.genre||'').toLowerCase().trim();
  const targetCountry = normalizeCountry(album.country);
  const targetLabel = (album.label||'').toLowerCase().trim();
  const scored = [];
  for(const a of state.albums){
    if(a.id === album.id) continue;
    let score = 0;
    const g = (a.genre||'').toLowerCase().trim();
    if(targetGenre && g){
      if(g === targetGenre) score += 5;
      else {
        // partial genre match (e.g. "Jazz" vs "Jazz experimental")
        const tg = targetGenre.split(/[\s,\-\/]+/).filter(Boolean);
        const og = g.split(/[\s,\-\/]+/).filter(Boolean);
        const common = tg.filter(t => og.includes(t)).length;
        if(common > 0) score += 2 * common;
      }
    }
    if(targetCountry && normalizeCountry(a.country) === targetCountry) score += 2;
    if(targetLabel && (a.label||'').toLowerCase().trim() === targetLabel) score += 3;
    if(a.keeper) score += 0.5; // tiny boost for keepers
    if(score >= 2) scored.push({a, score});
  }
  scored.sort((x,y) => y.score - x.score);
  return scored.slice(0, max).map(s => s.a);
}

/* ============= DISCOVER MODE ============= */
function buildDiscoverList(){
  const [scope, yearScope] = discoverState.scope.split('-');
  let pool = yearScope === 'year' 
    ? state.albums.filter(a => a.listen_year === state.currentYear)
    : state.albums.slice();
  if(scope === 'keepers') pool = pool.filter(a => a.keeper);
  // Two-tier sort:
  //   1. Never-seen albums first, in RANDOM order (true rediscovery)
  //   2. Then previously-seen albums, least-recently-seen first
  const neverSeen = pool.filter(a => !a.lastSeenAt);
  const seen = pool.filter(a => a.lastSeenAt);
  // Shuffle never-seen (Fisher-Yates)
  for(let i = neverSeen.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [neverSeen[i], neverSeen[j]] = [neverSeen[j], neverSeen[i]];
  }
  // Sort seen ascending by lastSeenAt
  seen.sort((a,b) => (a.lastSeenAt||0) - (b.lastSeenAt||0));
  discoverState.list = [...neverSeen, ...seen];
  discoverState.index = 0;
}
function openDiscover(){
  discoverState.active = true;
  buildDiscoverList();
  renderDiscover();
  document.getElementById('discover').classList.add('show');
}
function closeDiscover(){
  discoverState.active = false;
  document.getElementById('discover').classList.remove('show');
}
function discoverNav(delta){
  if(!discoverState.list.length) return;
  discoverState.index = (discoverState.index + delta + discoverState.list.length) % discoverState.list.length;
  renderDiscover();
}

/* Touch-swipe support for Discover */
let touchStartX = 0, touchStartY = 0;
function wireDiscoverSwipe(){
  const d = document.getElementById('discover');
  d.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, {passive: true});
  d.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5){
      if(dx < 0) discoverNav(1); else discoverNav(-1);
    }
  }, {passive: true});
}

async function renderWorldMap(countryMap){
  const wrap = document.getElementById('map-wrap');
  if(!wrap) return;
  if(!geoData) await loadGeoJSON();
  if(!geoData){ renderDotMap(countryMap); return; }
  const listenedISO3 = new Set();
  for(const iso2 of Object.keys(countryMap)){
    const iso3 = ISO2_TO_ISO3[iso2];
    if(iso3) listenedISO3.add(iso3);
  }
  const W = 1000, H = 500;
  const project = (lon, lat) => [(lon + 180) / 360 * W, (90 - lat) / 180 * H];
  function geomToPath(geom){
    const rings = [];
    if(geom.type === 'Polygon') rings.push(...geom.coordinates);
    else if(geom.type === 'MultiPolygon') for(const poly of geom.coordinates) rings.push(...poly);
    const parts = [];
    for(const ring of rings){
      if(!ring || !ring.length) continue;
      let p = '';
      for(let i = 0; i < ring.length; i++){
        const [x, y] = project(ring[i][0], ring[i][1]);
        p += (i===0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
      }
      p += 'Z';
      parts.push(p);
    }
    return parts.join(' ');
  }
  const pathsHtml = [];
  for(const feature of geoData.features){
    const iso3 = feature.id || (feature.properties && (feature.properties.ISO_A3 || feature.properties.iso_a3));
    if(!iso3 || iso3 === '-99') continue;
    const d = geomToPath(feature.geometry);
    if(!d) continue;
    const isActive = listenedISO3.has(iso3);
    const name = (feature.properties && (feature.properties.name || feature.properties.NAME)) || iso3;
    let count = 0, iso2 = '';
    for(const [k, v] of Object.entries(ISO2_TO_ISO3)){
      if(v === iso3 && countryMap[k]){ count = countryMap[k]; iso2 = k; break; }
    }
    pathsHtml.push(`<path class="map-country-path ${isActive?'active':''}" d="${d}" data-iso="${iso2}" data-name="${escapeHtml(name)}" data-count="${count}"></path>`);
  }
  wrap.innerHTML = `<svg class="map-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${pathsHtml.join('')}</svg><div id="map-tooltip"></div>`;
  const tooltip = document.getElementById('map-tooltip');
  wrap.querySelectorAll('.map-country-path').forEach(p => {
    p.addEventListener('mouseenter', () => {
      const name = p.dataset.name;
      const count = parseInt(p.dataset.count);
      tooltip.style.display = 'block';
      tooltip.innerHTML = `<strong>${escapeHtml(name)}</strong><br>${count ? count+' album'+(count===1?'':'s') : 'not yet'}`;
    });
    p.addEventListener('mousemove', (e) => {
      const rect = wrap.getBoundingClientRect();
      tooltip.style.left = (e.clientX - rect.left + 12) + 'px';
      tooltip.style.top = (e.clientY - rect.top + 12) + 'px';
    });
    p.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
    p.addEventListener('click', () => {
      const iso2 = p.dataset.iso;
      const count = parseInt(p.dataset.count);
      if(!count || !iso2) return;
      state.view = 'albums'; state.countryFilter = iso2;
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}
function renderDotMap(countryMap){
  const wrap = document.getElementById('map-wrap');
  const W = 1000, H = 500;
  const proj = (lat, lon) => [(lon + 180) / 360 * W, (90 - lat) / 180 * H];
  const maxCount = Math.max(...Object.values(countryMap), 1);
  let dots = '';
  for(const [iso, count] of Object.entries(countryMap)){
    const info = COUNTRY_DB[iso]; if(!info) continue;
    const [x, y] = proj(info[1], info[2]);
    const r = 3 + Math.sqrt(count/maxCount) * 18;
    dots += `<circle cx="${x}" cy="${y}" r="${r}" class="map-country-path active" data-iso="${iso}" data-name="${escapeHtml(info[0])}" data-count="${count}" opacity="0.85"/>`;
  }
  wrap.innerHTML = `<svg class="map-svg" viewBox="0 0 ${W} ${H}">
    <text x="${W/2}" y="30" text-anchor="middle" fill="var(--muted)" font-size="14">⚠️ Couldn't load world map — showing dots</text>${dots}</svg>`;
}

/* ============= SHARE IMAGE — Year in Review (redesigned) ============= */
async function generateShareImage(){
  // Choose format based on device hint — show a quick chooser

  if(!yearAlbums.length){ toast('No albums in ' + year); return; }

  const canvas = document.getElementById('share-canvas');
  // Set dimensions based on format
  const W = 1080;
  const H = formatChoice === 'story' ? 1920 : 1080;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // === Theme ===
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const bg = isDark ? '#1a1a1a' : '#f5f5f5';
  const fg = isDark ? '#e8e8e8' : '#1a1a1a';
  const muted = isDark ? '#9a9a9a' : '#666';
  const accent = '#f5c518';

  const keepers = yearAlbums.filter(a => a.keeper);

  // === Pre-fetch covers for the collage ===
  // Pick keepers (or all albums if no keepers) — random selection of up to 25
  let collagePool = keepers.length >= 12 ? keepers : yearAlbums;
  collagePool = [...collagePool].sort(() => Math.random() - 0.5);
  const collageCount = Math.min(25, collagePool.length);
  const collage = collagePool.slice(0, collageCount);

  // Pre-fetch covers in parallel
  const coverPromises = collage.map(a => {
    const k = coverKey(a.artist, a.title);
    if(coverCache[k]) return Promise.resolve({a, url: coverCache[k]});
    return fetchCover(a.artist, a.title).then(url => ({a, url}));
  });
  const withCovers = await Promise.all(coverPromises);

  function loadImg(url){
    return new Promise(resolve => {
      if(!url){ resolve(null); return; }
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = url;
      setTimeout(() => resolve(null), 4000);
    });
  }
  const imgs = await Promise.all(withCovers.map(c => loadImg(c.url)));

  // === Background gradient (subtle, derived from accent) ===
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, isDark ? '#1f1f1f' : '#ffffff');
  grad.addColorStop(1, isDark ? '#141414' : '#ececec');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Subtle accent glow at top
  const glow = ctx.createRadialGradient(W/2, 0, 0, W/2, 0, W*0.7);
  glow.addColorStop(0, isDark ? 'rgba(245,197,24,0.06)' : 'rgba(245,197,24,0.10)');
  glow.addColorStop(1, 'rgba(245,197,24,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // === Header: Brand + Year ===
  // Logo tile
  ctx.fillStyle = accent;
  roundRect(ctx, 60, 60, 70, 70, 14);
  ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  ctx.font = 'italic 700 44px Georgia, serif';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  ctx.fillText('O', 95, 95);

  // Brand text
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = fg;
  ctx.font = '700 38px -apple-system, BlinkMacSystemFont, sans-serif';
  ctx.fillText('Ostinato', 150, 65);
  ctx.fillStyle = muted;
  ctx.font = '400 16px sans-serif';
  ctx.fillText('Music, kept.', 150, 110);

  // Year badge (top right)
  ctx.fillStyle = accent;
  roundRect(ctx, W - 220, 60, 160, 70, 14);
  ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  ctx.font = '700 42px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(year), W - 140, 95);

  // === Hero stats ===
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = muted;
  ctx.font = '600 16px sans-serif';
  ctx.fillText('YEAR IN REVIEW', 60, 180);

  ctx.fillStyle = fg;
  ctx.font = '700 92px sans-serif';
  ctx.fillText(yearAlbums.length, 60, 215);
  ctx.font = '500 30px sans-serif';
  ctx.fillStyle = muted;
  const albumWidth = ctx.measureText(yearAlbums.length).width;
  ctx.fillText('albums', 60 + Math.ceil(getTextWidth(ctx, yearAlbums.length, '700 92px sans-serif')) + 18, 268);

  // Keepers row
  ctx.fillStyle = accent;
  ctx.font = '700 44px sans-serif';
  ctx.fillText('⭐ ' + keepers.length, 60, 320);
  ctx.fillStyle = muted;
  ctx.font = '500 22px sans-serif';
  const kpct = yearAlbums.length ? Math.round(keepers.length / yearAlbums.length * 100) : 0;
  ctx.fillText(`keepers · ${kpct}%`, 60 + getTextWidth(ctx, '⭐ ' + keepers.length, '700 44px sans-serif') + 16, 332);

  // === Quick stats row (3 metrics) ===
  const countryMap = {};
  yearAlbums.forEach(a => { const iso = normalizeCountry(a.country); if(iso) countryMap[iso] = (countryMap[iso]||0)+1; });
  const uniqueCountries = Object.keys(countryMap).length;
  const genreMap = {};
  yearAlbums.forEach(a => { if(a.genre) { const g = a.genre.trim(); genreMap[g] = (genreMap[g]||0)+1; } });
  const topGenre = Object.entries(genreMap).sort((a,b) => b[1]-a[1])[0];
  const labelMap = {};
  yearAlbums.forEach(a => { if(a.label){ const l = a.label.trim(); labelMap[l] = (labelMap[l]||0)+1; } });
  const topLabel = Object.entries(labelMap).sort((a,b) => b[1]-a[1])[0];

  const statsY = 400;
  const statsH = 90;
  const statW = (W - 180) / 3;

  function drawStatCard(x, label, value){
    ctx.fillStyle = isDark ? 'rgba(255,255,255,.04)' : 'rgba(0,0,0,.04)';
    roundRect(ctx, x, statsY, statW, statsH, 12);
    ctx.fill();
    ctx.fillStyle = muted;
    ctx.font = '600 12px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(label, x + 18, statsY + 18);
    ctx.fillStyle = fg;
    ctx.font = '700 26px sans-serif';
    const truncated = String(value).length > 16 ? String(value).slice(0,15) + '...' : String(value);
    ctx.fillText(truncated, x + 18, statsY + 44);
  }
  drawStatCard(60, 'COUNTRIES', uniqueCountries);
  drawStatCard(60 + statW + 30, 'TOP GENRE', topGenre ? topGenre[0] : '—');
  drawStatCard(60 + (statW + 30) * 2, 'TOP LABEL', topLabel ? topLabel[0] : '—');

  // === Cover collage — the hero ===
  const collageY = statsY + statsH + 50;
  const collageMaxH = H - collageY - 100; // leave room for footer

  // 5x5 grid for square (1080×1080), or 5×8 for story (1080×1920)
  const cols = 5;
  const rows = formatChoice === 'story' ? 8 : 5;
  const totalCells = cols * rows;
  const gap = 8;
  const cellSize = (W - 120 - (cols-1)*gap) / cols;
  const usedCells = Math.min(totalCells, withCovers.length);

  ctx.save();
  for(let i = 0; i < usedCells; i++){
    const row = Math.floor(i / cols);
    const col = i % cols;
    const x = 60 + col * (cellSize + gap);
    const y = collageY + row * (cellSize + gap);
    if(y + cellSize > H - 100) break;
    const a = withCovers[i].a;
    const img = imgs[i];

    // Round-rect clip
    ctx.save();
    roundRect(ctx, x, y, cellSize, cellSize, 8);
    ctx.clip();
    if(img){
      try { ctx.drawImage(img, x, y, cellSize, cellSize); }
      catch(e){ drawPlaceholder(ctx, x, y, cellSize, a); }
    } else {
      drawPlaceholder(ctx, x, y, cellSize, a);
    }
    ctx.restore();
  }
  ctx.restore();

  // === Footer ===
  const footerY = H - 60;
  ctx.fillStyle = muted;
  ctx.font = '500 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(`${collage.length} ${keepers.length >= 12 ? 'keepers' : 'albums'} from ${year} · ostinato`, W/2, footerY);

  // === Save (use device pixel ratio for sharp mobile output) ===
  // Note: canvas is already at 1080×, which is high-res. We just need to download as PNG.
  canvas.toBlob((blob) => {
    if(!blob){ toast('Failed to generate'); return; }
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `ostinato-${year}-${formatChoice}.png`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('✓ Saved');
  }, 'image/png');
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function getTextWidth(ctx, text, font){
  const old = ctx.font;
  ctx.font = font;
  const w = ctx.measureText(String(text)).width;
  ctx.font = old;
  return w;
}

function drawPlaceholder(ctx, x, y, size, a){
  const h = hashStr((a.artist||'')+(a.title||''));
  const hue = h % 360;
  const grad = ctx.createLinearGradient(x, y, x+size, y+size);
  grad.addColorStop(0, `hsl(${hue}, 50%, 30%)`);
  grad.addColorStop(1, `hsl(${(hue+60)%360}, 45%, 20%)`);
  ctx.fillStyle = grad;
  ctx.fillRect(x, y, size, size);
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.font = `italic 700 ${Math.floor(size*0.5)}px Georgia, serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(placeholderLetter(a.artist, a.title), x + size/2, y + size/2);
  ctx.textBaseline = 'alphabetic';
}

/* ============= iTunes AUTO-FILL (release year) ============= */
let autofillTimer = null;
let autofillLastKey = null;
async function tryAutoFillReleaseYear(){
  const artistEl = document.getElementById('f-artist');
  const titleEl = document.getElementById('f-title');
  const yearEl = document.getElementById('f-release-year');
  if(!artistEl || !titleEl || !yearEl) return;
  const artist = artistEl.value.trim();
  const title = titleEl.value.trim();
  // Need both to make a meaningful query
  if(!artist || !title) return;
  // Skip if user already typed a year
  if(yearEl.value && parseInt(yearEl.value) > 1900) return;
  // Skip if same query as last time
  const key = (artist+'|'+title).toLowerCase();
  if(key === autofillLastKey) return;
  autofillLastKey = key;
  // Show a subtle hint
  yearEl.placeholder = 'Looking up...';
  try {
    const q = encodeURIComponent(`${artist} ${title}`.trim());
    const url = `https://itunes.apple.com/search?term=${q}&entity=album&limit=1`;
    const r = await fetch(url);
    if(!r.ok){ yearEl.placeholder = ''; return; }
    const data = await r.json();
    if(!data.results || !data.results.length){ yearEl.placeholder = ''; return; }
    const hit = data.results[0];
    const ha = (hit.artistName||'').toLowerCase();
    const ht = (hit.collectionName||'').toLowerCase();
    const aMatch = ha.includes(artist.toLowerCase().slice(0,6)) || artist.toLowerCase().includes(ha.slice(0,6));
    const tMatch = ht.includes(title.toLowerCase().slice(0,6)) || title.toLowerCase().includes(ht.slice(0,6));
    if(!aMatch && !tMatch){ yearEl.placeholder = ''; return; }
    // Extract year from releaseDate like "2024-02-16T08:00:00Z"
    const m = /^(\d{4})/.exec(hit.releaseDate||'');
    if(m && !yearEl.value){
      yearEl.value = m[1];
      yearEl.placeholder = '';
      // Subtle visual feedback
      yearEl.style.borderColor = 'var(--keeper)';
      setTimeout(()=>{ yearEl.style.borderColor = ''; }, 1200);
    } else {
      yearEl.placeholder = '';
    }
  } catch(e){ yearEl.placeholder = ''; }
}
function debouncedAutoFill(){
  clearTimeout(autofillTimer);
  autofillTimer = setTimeout(tryAutoFillReleaseYear, 600);
}


/* =============================================================
   GIST SYNC ENGINE
============================================================= */
const SYNC_TOKEN_KEY = 'ostinato-sync-token';
const SYNC_GIST_ID_KEY = 'ostinato-sync-gist-id';
const SYNC_LAST_PUSH_KEY = 'ostinato-sync-last-push';
const SYNC_LAST_PULL_KEY = 'ostinato-sync-last-pull';
const SYNC_FILENAME = 'ostinato-data.json';

let syncState = {
  enabled: false,
  status: 'offline',  // 'offline' | 'syncing' | 'synced' | 'error'
  lastError: null,
  lastSyncAt: null,
  pushTimer: null,
  pullInterval: null,
};

function getSyncToken(){ return localStorage.getItem(SYNC_TOKEN_KEY) || ''; }
function getSyncGistId(){ return localStorage.getItem(SYNC_GIST_ID_KEY) || ''; }
function setSyncToken(t){
  if(t) localStorage.setItem(SYNC_TOKEN_KEY, t);
  else localStorage.removeItem(SYNC_TOKEN_KEY);
}
function setSyncGistId(id){
  if(id) localStorage.setItem(SYNC_GIST_ID_KEY, id);
  else localStorage.removeItem(SYNC_GIST_ID_KEY);
}

function syncStatusUpdate(status, error){
  syncState.status = status;
  syncState.lastError = error || null;
  const btn = document.getElementById('btn-sync-status');
  if(!btn) return;
  if(!syncState.enabled){ btn.style.display = 'none'; return; }
  btn.style.display = '';
  const map = {
    'syncing': { icon: '⏳', title: 'Syncing...' },
    'synced': { icon: '☁️', title: `Synced ${syncState.lastSyncAt ? new Date(syncState.lastSyncAt).toLocaleTimeString() : ''}` },
    'error': { icon: '⚠️', title: `Sync error: ${error||'unknown'}` },
    'offline': { icon: '☁️', title: 'Sync configured (idle)' },
  };
  const m = map[status] || map['offline'];
  btn.textContent = m.icon;
  btn.title = m.title;
}

/* ============= GitHub API helpers ============= */
async function ghApi(path, opts={}){
  const token = getSyncToken();
  if(!token) throw new Error('No token configured');
  const url = `https://api.github.com${path}`;
  const headers = Object.assign({
    'Accept': 'application/vnd.github+json',
    'Authorization': `Bearer ${token}`,
    'X-GitHub-Api-Version': '2022-11-28',
  }, opts.headers || {});
  const r = await fetch(url, { ...opts, headers });
  if(!r.ok){
    let msg = `HTTP ${r.status}`;
    try {
      const body = await r.json();
      if(body.message) msg = body.message;
    } catch(e){}
    throw new Error(msg);
  }
  return r.json();
}

/* ============= Validate token + Gist setup ============= */
async function validateToken(token){
  // Check that token is valid by hitting /user (very basic GH API call)
  const r = await fetch('https://api.github.com/user', {
    headers: {
      'Accept': 'application/vnd.github+json',
      'Authorization': `Bearer ${token}`,
    }
  });
  if(!r.ok){
    let msg = `HTTP ${r.status}`;
    try { const body = await r.json(); if(body.message) msg = body.message; } catch(e){}
    throw new Error(msg);
  }
  const user = await r.json();
  return user.login;
}

async function createGist(){
  const payload = buildSyncPayload();
  const body = {
    description: 'Ostinato music tracker — sync data',
    public: false,
    files: {
      [SYNC_FILENAME]: { content: JSON.stringify(payload, null, 2) }
    }
  };
  const result = await ghApi('/gists', {
    method: 'POST',
    body: JSON.stringify(body),
  });
  return result.id;
}

async function pullFromGist(){
  const gistId = getSyncGistId();
  if(!gistId) throw new Error('No Gist ID');
  const gist = await ghApi(`/gists/${gistId}`);
  const file = gist.files && gist.files[SYNC_FILENAME];
  if(!file) throw new Error(`File ${SYNC_FILENAME} not found in Gist`);
  let content = file.content;
  // Handle truncated content (large files)
  if(file.truncated && file.raw_url){
    const r = await fetch(file.raw_url, {
      headers: { 'Authorization': `Bearer ${getSyncToken()}` }
    });
    if(!r.ok) throw new Error(`Failed to fetch raw content`);
    content = await r.text();
  }
  return JSON.parse(content);
}

async function pushToGist(){
  const gistId = getSyncGistId();
  if(!gistId) throw new Error('No Gist ID');
  const payload = buildSyncPayload();
  await ghApi(`/gists/${gistId}`, {
    method: 'PATCH',
    body: JSON.stringify({
      files: {
        [SYNC_FILENAME]: { content: JSON.stringify(payload, null, 2) }
      }
    })
  });
}

/* ============= Build / apply sync payload ============= */
function buildSyncPayload(){
  return {
    version: 1,
    updatedAt: Date.now(),
    albums: state.albums,
    toListen: state.toListen,
  };
}

function applySyncPayload(payload){
  if(!payload || !payload.albums) throw new Error('Invalid sync payload');
  state.albums = payload.albums;
  state.toListen = payload.toListen || [];
  // Save locally too
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.albums)); } catch(e){}
  try { localStorage.setItem(TOLISTEN_KEY, JSON.stringify(state.toListen)); } catch(e){}
  // Seed cover cache from any manual coverUrl values (so they persist after sync)
  seedCoverCacheFromAlbums();
  backfillCreatedAt();
}
function seedCoverCacheFromAlbums(){
  for(const a of [...state.albums, ...state.toListen]){
    if(a.coverUrl){
      const k = coverKey(a.artist, a.title);
      coverCache[k] = a.coverUrl;
    }
  }
  saveCovers();
}

/* ============= Sync orchestration ============= */
async function syncPushDebounced(){
  if(!syncState.enabled) return;
  clearTimeout(syncState.pushTimer);
  syncState.pushTimer = setTimeout(async () => {
    syncState.pushTimer = null;
    try {
      syncStatusUpdate('syncing');
      await pushToGist();
      localStorage.setItem(SYNC_LAST_PUSH_KEY, String(Date.now()));
      syncState.lastSyncAt = Date.now();
      syncStatusUpdate('synced');
    } catch(e){
      console.error('Sync push failed:', e);
      syncStatusUpdate('error', e.message);
    }
  }, 3000);
}

async function syncPullOnce(){
  if(!syncState.enabled) return;
  try {
    syncStatusUpdate('syncing');
    const remote = await pullFromGist();
    const localUpdatedAt = parseInt(localStorage.getItem(SYNC_LAST_PUSH_KEY) || '0');
    if(remote.updatedAt && remote.updatedAt > localUpdatedAt){
      // Cloud is newer — apply
      applySyncPayload(remote);
      localStorage.setItem(SYNC_LAST_PULL_KEY, String(Date.now()));
      // Don't immediately push — we just pulled
      localStorage.setItem(SYNC_LAST_PUSH_KEY, String(remote.updatedAt));
      render();
      toast('🔄 Updated from cloud');
    }
    syncState.lastSyncAt = Date.now();
    syncStatusUpdate('synced');
  } catch(e){
    console.error('Sync pull failed:', e);
    syncStatusUpdate('error', e.message);
  }
}

function startSync(){
  syncState.enabled = !!(getSyncToken() && getSyncGistId());
  if(!syncState.enabled) return;
  syncStatusUpdate('synced');
  // Pull on start
  syncPullOnce();
  // Periodic pull every 60 seconds (cheap — just a small JSON fetch)
  if(syncState.pullInterval) clearInterval(syncState.pullInterval);
  syncState.pullInterval = setInterval(syncPullOnce, 60000);
  // Pull when tab regains focus
  document.addEventListener('visibilitychange', () => {
    if(!document.hidden && syncState.enabled) syncPullOnce();
  });
}

function disableSync(){
  syncState.enabled = false;
  clearTimeout(syncState.pushTimer);
  clearInterval(syncState.pullInterval);
  setSyncToken('');
  setSyncGistId('');
  localStorage.removeItem(SYNC_LAST_PUSH_KEY);
  localStorage.removeItem(SYNC_LAST_PULL_KEY);
  syncStatusUpdate('offline');
  document.getElementById('btn-sync-status').style.display = 'none';
}
