        Open Ostinato on any device → same data everywhere.
      </div>
      <div class="sync-step">
        <span class="num">1</span>
        <div class="body">
          <strong>Have your Personal Access Token ready</strong>
          The token starts with <code>github_pat_</code>. If you don't have one, visit
          <a href="https://github.com/settings/tokens?type=beta" target="_blank">github.com/settings/tokens</a>
          and create one with <strong>Gists: Read &amp; write</strong> permission.
        </div>
      </div>
      <div class="sync-step">
        <span class="num">2</span>
        <div class="body">
          <strong>Paste your token below</strong>
          <input type="password" id="sync-token-input" placeholder="github_pat_..." 
            style="margin-top:6px;width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:monospace;font-size:12px">
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
        <button class="btn" onclick="closeSyncModal()">Cancel</button>
        <button class="btn btn-primary" onclick="syncSetupStep1()">Continue</button>
      </div>`;
    return;
  }

  if(!gistId){
    // Step 2: Choose first-time vs existing
    body.innerHTML = `
      <div class="sync-info-box success">✓ Token validated</div>
      <div class="sync-info-box">
        <strong>First time setup?</strong> We'll create a new private Gist with your current data.
        <br><strong>Already synced from another device?</strong> Paste the existing Gist ID.
      </div>
      <div class="sync-step">
        <span class="num">A</span>
        <div class="body">
          <strong>First device — Create new Gist</strong>
          Uploads your current ${state.albums.length} albums to a new private Gist.
          <button class="btn btn-primary" onclick="syncSetupCreateNew()" style="margin-top:8px;width:100%">Create new Gist</button>
        </div>
      </div>
      <div class="sync-step">
        <span class="num">B</span>
        <div class="body">
          <strong>Connecting another device — Use existing Gist</strong>
          Paste the Gist ID (looks like <code>a1b2c3d4...</code>):
          <input type="text" id="sync-gist-input" placeholder="Gist ID" 
            style="margin-top:6px;width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:monospace;font-size:12px">
          <button class="btn btn-primary" onclick="syncSetupConnect()" style="margin-top:8px;width:100%">Connect to existing Gist</button>
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:space-between;margin-top:8px">
        <button class="btn" onclick="syncSetupForgetToken()" style="color:var(--red)">Forget token</button>
        <button class="btn" onclick="closeSyncModal()">Cancel</button>
      </div>`;
    return;
  }

  // Already configured: show status + options
  const lastPush = parseInt(localStorage.getItem(SYNC_LAST_PUSH_KEY) || '0');
  const lastPull = parseInt(localStorage.getItem(SYNC_LAST_PULL_KEY) || '0');
  const fmt = (t) => t ? new Date(t).toLocaleString() : 'never';
  body.innerHTML = `
    <div class="sync-info-box success">
      <strong>✓ Sync active</strong><br>
      Status: <strong>${syncState.status}</strong>
      ${syncState.lastError ? `<br><span style="color:var(--red)">Error: ${escapeHtml(syncState.lastError)}</span>` : ''}
    </div>
    <div style="font-size:13px;color:var(--muted);line-height:1.8">
      <div><strong style="color:var(--text)">Gist ID:</strong> <code style="background:var(--bg3);padding:2px 6px;border-radius:3px;font-size:11px;color:var(--accent);user-select:all">${escapeHtml(gistId)}</code> 
        <button class="btn btn-icon" onclick="navigator.clipboard.writeText('${escapeHtml(gistId)}');toast('Copied!')" style="padding:2px 8px;font-size:11px;margin-left:6px">Copy</button>
      </div>
      <div><strong style="color:var(--text)">Last push:</strong> ${fmt(lastPush)}</div>
      <div><strong style="color:var(--text)">Last pull:</strong> ${fmt(lastPull)}</div>
      <div><strong style="color:var(--text)">Albums:</strong> ${state.albums.length} · <strong style="color:var(--text)">To Listen:</strong> ${state.toListen.length}</div>
    </div>
    <div class="sync-info-box">
      <strong>📱 Connect another device:</strong> Open Ostinato on phone/Mac → Menu → ☁️ Set up sync → 
      enter the same token + paste the Gist ID above.
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:10px">
      <button class="btn" onclick="syncManualPull()">⬇️ Pull now</button>
      <button class="btn" onclick="syncManualPush()">⬆️ Push now</button>
      <button class="btn" onclick="syncDisableConfirm()" style="color:var(--red)">Disable sync</button>
      <button class="btn btn-primary" onclick="closeSyncModal()">Done</button>
    </div>`;
}

async function syncSetupStep1(){
  const input = document.getElementById('sync-token-input');
  const token = (input.value || '').trim();
  if(!token){ toast('Token required'); return; }
  if(!token.startsWith('github_pat_') && !token.startsWith('ghp_')){
    if(!confirm('Token does not start with github_pat_ or ghp_ — continue anyway?')) return;
  }
  toast('Validating token...');
  try {
    const username = await validateToken(token);
    setSyncToken(token);
    toast(`✓ Hello, ${username}!`);
    renderSyncModal();
  } catch(e){
    alert(`Token validation failed: ${e.message}\n\nMake sure:\n1. Token has "Gists: Read and write" permission\n2. Token is not expired\n3. You copied the full token`);
  }
}

async function syncSetupCreateNew(){
  toast('Creating Gist...');
  try {
    const id = await createGist();
    setSyncGistId(id);
    localStorage.setItem(SYNC_LAST_PUSH_KEY, String(Date.now()));
    startSync();
    toast('✓ Sync activated!');
    renderSyncModal();
  } catch(e){
    alert(`Failed to create Gist: ${e.message}`);
  }
}

async function syncSetupConnect(){
  const input = document.getElementById('sync-gist-input');
  let id = (input.value || '').trim();
  // Allow pasting full gist URL
  const m = id.match(/[a-f0-9]{20,}/i);
  if(m) id = m[0];
  if(!id){ toast('Gist ID required'); return; }
  toast('Connecting to Gist...');
  setSyncGistId(id);
  try {
    const remote = await pullFromGist();
    if(!confirm(`Connected! Cloud has ${remote.albums?.length || 0} albums and ${remote.toListen?.length || 0} to-listen items.\n\nReplace your local data with cloud data?`)){
      setSyncGistId('');
      return;
    }
    applySyncPayload(remote);
    localStorage.setItem(SYNC_LAST_PUSH_KEY, String(remote.updatedAt || Date.now()));
    startSync();
    render();
    toast('✓ Connected to cloud!');
    renderSyncModal();
  } catch(e){
    setSyncGistId('');
    alert(`Failed to connect: ${e.message}\n\nCheck the Gist ID is correct and your token has access.`);
  }
}

function syncSetupForgetToken(){
  if(!confirm('Forget the token? You will need to enter it again to use sync.')) return;
  setSyncToken('');
  syncState.enabled = false;
  document.getElementById('btn-sync-status').style.display = 'none';
  renderSyncModal();
}

async function syncManualPull(){
  toast('Pulling from cloud...');
  await syncPullOnce();
}

async function syncManualPush(){
  toast('Pushing to cloud...');
  try {
    syncStatusUpdate('syncing');
    await pushToGist();
    localStorage.setItem(SYNC_LAST_PUSH_KEY, String(Date.now()));
    syncState.lastSyncAt = Date.now();
    syncStatusUpdate('synced');
    toast('✓ Pushed');
    renderSyncModal();
  } catch(e){
    syncStatusUpdate('error', e.message);
    alert(`Push failed: ${e.message}`);
  }
}

function syncDisableConfirm(){
  if(!confirm('Disable sync on this device?\n\nYour data will remain on this device but stop syncing. The Gist on GitHub stays untouched (other devices keep working).')) return;
  disableSync();
  toast('Sync disabled');
  closeSyncModal();
}



/* ============= COVER URL HELPERS ============= */
function updateCoverPreview(){
  const url = document.getElementById('f-cover-url').value.trim();
  const wrap = document.getElementById('f-cover-preview');
  const img = document.getElementById('f-cover-preview-img');
  if(url && (url.startsWith('http://') || url.startsWith('https://'))){
    img.src = url;
    wrap.style.display = '';
  } else {
    wrap.style.display = 'none';
  }
}
function clearCoverUrl(){
  document.getElementById('f-cover-url').value = '';
  updateCoverPreview();
}

/* ============= DISCOGS COVER SEARCH ============= */
async function openDiscogsSearch(){
  const artist = document.getElementById('f-artist').value.trim();
  const title = document.getElementById('f-title').value.trim();
  if(!artist && !title){ toast('Enter artist or title first'); return; }
  const modal = document.getElementById('discogs-modal');
  const body = document.getElementById('discogs-modal-body');
  body.innerHTML = `<div class="discogs-loading">⏳ Searching Discogs...</div>`;
  modal.classList.add('show');

  // Discogs database search — no auth needed for low rate
  // Format: https://api.discogs.com/database/search?q=ARTIST+TITLE&type=release
  const q = encodeURIComponent(`${artist} ${title}`.trim());
  const url = `https://api.discogs.com/database/search?q=${q}&type=release&per_page=12`;

  try {
    const r = await fetch(url, {
      headers: {
        'Accept': 'application/json',
        'User-Agent': 'Ostinato/1.0',
      }
    });
    if(!r.ok){
      if(r.status === 401 || r.status === 403){
        body.innerHTML = `<div style="color:var(--muted);text-align:center;padding:20px;font-size:13px">
          ⚠️ Discogs requires authentication for this search.<br>
          You can still paste a cover URL manually in the field above.
        </div>`;
        return;
      }
      throw new Error('HTTP ' + r.status);
    }
    const data = await r.json();
    const results = (data.results || []).filter(x => x.cover_image && !x.cover_image.endsWith('spacer.gif'));
    if(!results.length){
      body.innerHTML = `<div style="color:var(--muted);text-align:center;padding:20px;font-size:13px">
        No cover candidates found.<br>
        Try simplifying the search (e.g., remove subtitles or special characters).
      </div>`;
      return;
    }
    body.innerHTML = `
      <div style="font-size:13px;color:var(--muted);margin-bottom:8px">
        Click a cover to use it. Best matches first.
      </div>
      <div class="discogs-grid">
        ${results.slice(0, 12).map((r, i) => `
          <div class="discogs-result" data-url="${escapeHtml(r.cover_image)}" data-idx="${i}">
            <img src="${escapeHtml(r.cover_image)}" alt="" loading="lazy">
            <div class="label">${escapeHtml(r.title || '')}${r.year?' · '+r.year:''}</div>
          </div>
        `).join('')}
      </div>
      <div style="font-size:11px;color:var(--muted);text-align:center;margin-top:10px">
        Powered by Discogs
      </div>`;
    body.querySelectorAll('.discogs-result').forEach(el => {
      el.onclick = () => {
        const url = el.dataset.url;
        document.getElementById('f-cover-url').value = url;
        updateCoverPreview();
        closeDiscogsModal();
        toast('Cover selected');
      };
    });
  } catch(e){
    body.innerHTML = `<div style="color:var(--red);text-align:center;padding:20px;font-size:13px">
      Discogs search failed: ${escapeHtml(e.message)}<br>
      <span style="color:var(--muted);font-size:12px">You can paste a URL manually instead.</span>
    </div>`;
  }
}
function closeDiscogsModal(){
  document.getElementById('discogs-modal').classList.remove('show');
}


function populateDatalists(){
  // Combine static suggestions with any new values from user's current data
  const dynamicCountries = new Set([...COUNTRY_SUGGESTIONS]);
  const dynamicGenres = new Set([...GENRE_SUGGESTIONS]);
  const dynamicLabels = new Set([...LABEL_SUGGESTIONS]);
  for(const a of [...state.albums, ...state.toListen]){
    if(a.country) dynamicCountries.add(a.country);
    if(a.genre) dynamicGenres.add(a.genre);
    if(a.label) dynamicLabels.add(a.label);
  }
  const fill = (id, values) => {
    const el = document.getElementById(id);
    if(!el) return;
    el.innerHTML = [...values].sort((a,b)=>a.localeCompare(b))
      .map(v => `<option value="${escapeHtml(v)}"></option>`).join('');
  };
  fill('country-list', dynamicCountries);
  fill('genre-list', dynamicGenres);
  fill('label-list', dynamicLabels);
}

document.addEventListener('DOMContentLoaded', () => {
  loadTheme();
  loadData();
  loadCovers();
  loadGeoJSON();
  populateDatalists();
  wireDiscoverSwipe();
  startSync();
  // Wire sync status button + modal backdrop
  const syncBtn = document.getElementById('btn-sync-status');
  if(syncBtn) syncBtn.onclick = openSyncModal;
  const syncModal = document.getElementById('sync-modal');
  if(syncModal) syncModal.addEventListener('click', e => {
    if(e.target.id === 'sync-modal') closeSyncModal();
  });

  document.querySelectorAll('.chip').forEach(c => {
    c.onclick = () => { state.filter = c.dataset.filter; render(); };
  });
  document.getElementById('search').addEventListener('input', (e) => {
    state.search = e.target.value; render();
  });
  document.getElementById('sort').addEventListener('change', (e) => {
    state.sort = e.target.value; render();
  });
  document.getElementById('group').addEventListener('change', (e) => {
    state.group = e.target.value; render();
  });
  document.getElementById('view-list').onclick = () => {
    state.layout = 'list';
    localStorage.setItem(VIEW_KEY, 'list');
    render();
  };
  document.getElementById('view-wall').onclick = () => {
    state.layout = 'wall';
    localStorage.setItem(VIEW_KEY, 'wall');
    render();
  };
  document.getElementById('app-title').onclick = () => {
    state.view = 'albums'; state.currentYear = 2026;
    state.countryFilter = null; state.filter = 'all'; state.search = '';
    document.getElementById('search').value = '';
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  };
  document.getElementById('btn-stats').onclick = () => {
    state.view = 'stats'; render(); window.scrollTo({top:0});
  };
  document.getElementById('btn-add').onclick = () => {
    const source = state.view === 'tolisten' ? 'tolisten' : 'albums';
    openEditModal(null, source);
  };
  document.getElementById('btn-menu').onclick = () => document.getElementById('menu-modal').classList.add('show');
  document.getElementById('btn-theme').onclick = toggleTheme;
  document.getElementById('btn-explore').onclick = openDiscover;
  document.getElementById('btn-save').onclick = saveModal;
  document.getElementById('btn-delete').onclick = deleteAlbum;
  document.getElementById('btn-move-confirm').onclick = confirmMove;
  document.getElementById('discover-scope').onchange = (e) => {
    discoverState.scope = e.target.value;
    buildDiscoverList();
    renderDiscover();
  };
  // Wire iTunes auto-fill on Artist/Title change
  document.getElementById('f-artist').addEventListener('input', debouncedAutoFill);
  document.getElementById('f-title').addEventListener('input', debouncedAutoFill);
  // Live preview for cover URL field
  document.getElementById('f-cover-url').addEventListener('input', updateCoverPreview);
  // Discogs modal backdrop
  document.getElementById('discogs-modal').addEventListener('click', e => {
    if(e.target.id === 'discogs-modal') closeDiscogsModal();
  });
  // Reset the autofill cache when opening the modal fresh
  document.getElementById('f-artist').addEventListener('focus', () => { autofillLastKey = null; });

  document.getElementById('modal').addEventListener('click', e => {
    if(e.target.id === 'modal') closeModal();
  });
  document.getElementById('menu-modal').addEventListener('click', e => {
    if(e.target.id === 'menu-modal') closeMenu();
  });
  document.getElementById('detail-modal').addEventListener('click', e => {
    if(e.target.id === 'detail-modal') closeDetailModal();
  });
  document.getElementById('move-modal').addEventListener('click', e => {
    if(e.target.id === 'move-modal') closeMove();
  });

  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){
      closeModal(); closeMenu(); closeDetailModal(); closeMove(); closeSyncModal(); closeDiscogsModal();
      if(discoverState.active) closeDiscover();
    }
    if(discoverState.active){
      if(e.key === 'ArrowLeft') discoverNav(-1);
      else if(e.key === 'ArrowRight') discoverNav(1);
      else if(e.key === 's' || e.key === 'S'){
        // Toggle keeper on current
        document.getElementById('discover-keeper')?.click();
      }
    }
  });

  document.getElementById('import-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        let albums, toListen;
        if(Array.isArray(data)){ albums = data; toListen = state.toListen; }
        else { albums = data.albums || []; toListen = data.toListen || []; }
        const msg = `Import ${albums.length} albums` + (toListen.length ? ` + ${toListen.length} to-listen` : '') + '? This replaces current data.';
        if(!confirm(msg)) return;
        state.albums = albums; state.toListen = toListen;
        saveData(); saveToListen();
        closeMenu(); render();
        toast('Imported');
      } catch(err){ alert('Invalid JSON file'); }
    };
    reader.readAsText(file);
  });

  const fab = document.getElementById('fab-top');
  fab.onclick = () => window.scrollTo({top:0, behavior:'smooth'});
  window.addEventListener('scroll', () => {
    fab.classList.toggle('show', window.scrollY > 400);
  });

  render();
});
</script>
